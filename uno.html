<!DOCTYPE html>
<html>
  <head>
    <title>Mi Página Azul</title>
    <meta charset="UTF-8">
    <style>
      body {
        background-color: #e0f0ff;
        color: #003366;
        font-family: Verdana, sans-serif;
        text-align: center;
        padding: 50px;
      }
      h1 {
        color: #0055cc;
      }
      p {
        font-size: 18px;
        margin: 20px 0;
      }
      .caja {
        background-color: #cce6ff;
        padding: 20px;
        border-radius: 15px;
        width: 80%;
        max-width: 500px;
        margin: 0 auto;
        box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      }
      img {
        width: 100%;
        max-width: 600px;
        border-radius: 12px;
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <img src="https://upload.wikimedia.org/wikipedia/commons/0/0f/Ocean_wave.jpg" alt="Océano">
    
    <div class="caja">
      <h1>¡Hola! Soy [Elizabeth] </h1>
      <p>Tengo [16] años y me gusta [jugar basquet] .</p>
      <p>Estoy aprendiendo a crear páginas web con HTML.</p>
    </div>
  </body>
</html>
